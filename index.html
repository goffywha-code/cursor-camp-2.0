<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Camp - 2D RPG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* Start Screen Modal */
    #startModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 15, 25, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }

    #startModal.hidden {
      display: none !important;
      pointer-events: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      width: 340px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .modal-box h1 {
      color: #f59e0b;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .modal-box p {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .modal-input {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 16px;
      text-align: center;
    }

    .hat-select-label {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 8px;
      text-align: left;
    }

    .hat-options {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .hat-btn {
      flex: 1;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 11px;
      cursor: pointer;
      color: #94a3b8;
    }

    .hat-btn.selected {
      border-color: #f59e0b;
      color: #fff;
      background: #334155;
    }

    .start-btn {
      width: 100%;
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .start-btn:hover {
      background: #d97706;
    }

    /* HUD */
    .hud-top {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(18, 24, 38, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 16px;
      z-index: 10;
    }

    .hud-controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      color: #cbd5e1;
      z-index: 10;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Start Screen Modal -->
  <div id="startModal">
    <div class="modal-box">
      <h1>🔥 Cursor Camp 🔥</h1>
      <p>Type your name and pick a hat to join!</p>
      
      <input type="text" id="playerNameInput" class="modal-input" placeholder="Your Name" maxlength="12" value="Camper">
      
      <div class="hat-select-label">Choose Your Hat:</div>
      <div class="hat-options">
        <button class="hat-btn selected" onclick="pickHat('none', this)">None</button>
        <button class="hat-btn" onclick="pickHat('cowboy', this)">🤠 Cowboy</button>
        <button class="hat-btn" onclick="pickHat('beanie', this)">🧢 Beanie</button>
        <button class="hat-btn" onclick="pickHat('wizard', this)">🧙‍♂️ Wizard</button>
      </div>

      <button class="start-btn" id="enterBtn" onclick="enterGame()">Enter Campsite</button>
    </div>
  </div>

  <!-- HUD Header -->
  <div class="hud-top">
    <div style="font-weight: bold; color: #f59e0b; font-size: 15px;">⛺ Cursor Camp RPG</div>
    <div style="font-size: 12px; color: #10b981;" id="activeCampers">1 Camper Active</div>
  </div>

  <div class="hud-controls-hint">
    Walk: <b>WASD</b> or <b>Arrow Keys</b> | Sit/Enter Cabin: Press <b>E</b>
  </div>

  <canvas id="gameCanvas"></canvas>

<script>
  let db = null;
  const firebaseConfig = {
    apiKey: "AIzaSyACp-ZSaVYaUJEIxGNKTuFSXJkq9RPC0fA",
    authDomain: "cursor-camp-788be.firebaseapp.com",
    databaseURL: "https://cursor-camp-788be-default-rtdb.firebaseio.com",
    projectId: "cursor-camp-788be",
    storageBucket: "cursor-camp-788be.firebasestorage.app",
    messagingSenderId: "840054967773",
    appId: "1:840054967773:web:67a52ff630cc2ab3687a34",
    measurementId: "G-YQPWH70W4G"
  };

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    console.log("Offline mode");
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let gameStarted = false;
  let playerName = "Camper";
  let playerHat = "none";
  let inCabin = false;
  const playerId = 'player_' + Math.random().toString(36).substr(2, 9);
  let playerRef = null;

  if (db) {
    playerRef = db.ref('players/' + playerId);
    playerRef.onDisconnect().remove();
  }

  const myPlayer = {
    x: window.innerWidth / 2 + 100,
    y: window.innerHeight / 2 + 50,
    speed: 4,
    isSitting: false,
    facing: 'right'
  };

  function pickHat(hatName, btnElement) {
    playerHat = hatName;
    document.querySelectorAll('.hat-btn').forEach(b => b.classList.remove('selected'));
    btnElement.classList.add('selected');
  }

  function enterGame() {
    const nameVal = document.getElementById('playerNameInput').value.trim();
    if (nameVal) playerName = nameVal;
    
    // Explicitly hide modal and disable pointer events
    const modal = document.getElementById('startModal');
    modal.classList.add('hidden');
    modal.style.display = 'none';
    modal.style.pointerEvents = 'none';
    gameStarted = true;
  }

  document.getElementById('playerNameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enterGame();
  });

  const logs = [
    { offsetX: 0, offsetY: -55, angle: 0 },
    { offsetX: 55, offsetY: 0, angle: Math.PI / 2 },
    { offsetX: 0, offsetY: 55, angle: Math.PI },
    { offsetX: -55, offsetY: 0, angle: (3 * Math.PI) / 2 }
  ];

  const trees = [];
  for (let i = 0; i < 30; i++) {
    trees.push({
      x: (Math.random() * 1.6 - 0.3) * 2000,
      y: (Math.random() * 1.6 - 0.3) * 2000,
      scale: Math.random() * 0.4 + 0.8
    });
  }

  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'e' && gameStarted) {
      handleInteract();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function handleInteract() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    if (!inCabin) {
      const cabinDoorX = cx + 200;
      const cabinDoorY = cy - 120;
      if (Math.hypot(myPlayer.x - cabinDoorX, myPlayer.y - cabinDoorY) < 60) {
        inCabin = true;
        myPlayer.x = cx;
        myPlayer.y = cy + 180;
        return;
      }

      if (myPlayer.isSitting) {
        myPlayer.isSitting = false;
        myPlayer.y += 25;
      } else {
        logs.forEach((log) => {
          const lx = cx + log.offsetX;
          const ly = cy + log.offsetY;
          if (Math.hypot(myPlayer.x - lx, myPlayer.y - ly) < 45) {
            myPlayer.isSitting = true;
            myPlayer.x = lx;
            myPlayer.y = ly - 4;
          }
        });
      }
    } else {
      if (myPlayer.y > cy + 200) {
        inCabin = false;
        myPlayer.x = cx + 200;
        myPlayer.y = cy - 90;
      }
    }
  }

  function drawTree(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.fillStyle = '#3d2817';
    ctx.fillRect(-4, 10, 8, 20);

    ctx.fillStyle = '#064e3b';
    ctx.beginPath();
    ctx.moveTo(0, -25);
    ctx.lineTo(-28, 15);
    ctx.lineTo(28, 15);
    ctx.fill();

    ctx.fillStyle = '#047857';
    ctx.beginPath();
    ctx.moveTo(0, -40);
    ctx.lineTo(-22, -2);
    ctx.lineTo(22, -2);
    ctx.fill();

    ctx.fillStyle = '#10b981';
    ctx.beginPath();
    ctx.moveTo(0, -55);
    ctx.lineTo(-15, -15);
    ctx.lineTo(15, -15);
    ctx.fill();

    ctx.restore();
  }

  // Exact detailed cabin interior render function
  function drawCabinInteriorDetailed(ctx, cx, cy) {
    const w = 900;
    const h = 580;
    const x = cx - w / 2;
    const y = cy - h / 2;

    // Teal Back Wall
    ctx.fillStyle = '#126161';
    ctx.fillRect(x, y, w, h);

    // Vaulted Dark Wooden Roof Rafters
    ctx.fillStyle = '#3d1c16';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(cx, y - 80);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + 90);
    ctx.lineTo(cx, y + 10);
    ctx.lineTo(x, y + 90);
    ctx.closePath();
    ctx.fill();

    // Rafter beams
    ctx.strokeStyle = '#27100b';
    ctx.lineWidth = 6;
    for (let i = 0; i < 6; i++) {
      const bx = x + (w / 5) * i;
      ctx.beginPath();
      ctx.moveTo(bx, y + 90);
      ctx.lineTo(cx, y - 80);
      ctx.stroke();
    }

    // Wooden Plank Floor
    ctx.fillStyle = '#e69a53';
    ctx.fillRect(x, y + 330, w, h - 330);

    ctx.strokeStyle = '#c87c35';
    ctx.lineWidth = 2;
    for (let fy = y + 360; fy < y + h; fy += 30) {
      ctx.beginPath();
      ctx.moveTo(x, fy);
      ctx.lineTo(x + w, fy);
      ctx.stroke();
    }

    // Grid Windows across back wall
    const winX = cx - 280;
    const winY = y + 120;
    const winW = 560;
    const winH = 180;

    ctx.fillStyle = '#94d2bd';
    ctx.fillRect(winX, winY, winW, winH);

    ctx.strokeStyle = '#1e3838';
    ctx.lineWidth = 4;
    ctx.strokeRect(winX, winY, winW, winH);

    // Window Grids & Bookshelves
    ctx.lineWidth = 3;
    for (let wx = winX + 70; wx < winX + winW; wx += 70) {
      ctx.beginPath(); ctx.moveTo(wx, winY); ctx.lineTo(wx, winY + winH); ctx.stroke();
    }
    for (let wy = winY + 45; wy < winY + winH; wy += 45) {
      ctx.beginPath(); ctx.moveTo(winX, wy); ctx.lineTo(winX + winW, wy); ctx.stroke();
    }

    // Books on Window Ledge
    ctx.fillStyle = '#b93817'; ctx.fillRect(winX + 10, winY + 140, 45, 35);
    ctx.fillStyle = '#115e59'; ctx.fillRect(winX + 60, winY + 145, 30, 30);
    ctx.fillStyle = '#d97706'; ctx.fillRect(winX + 410, winY + 135, 55, 40);

    // Yellow Couch with Cat (Left)
    const couchX = x + 70;
    const couchY = y + 350;
    ctx.fillStyle = '#d4ac0d';
    ctx.fillRect(couchX, couchY, 210, 95);
    ctx.fillStyle = '#b7950b';
    ctx.fillRect(couchX + 15, couchY - 30, 180, 40);
    ctx.fillRect(couchX - 10, couchY + 10, 25, 75);
    ctx.fillRect(couchX + 195, couchY + 10, 25, 75);

    // Pillows
    ctx.fillStyle = '#b93817';
    ctx.fillRect(couchX + 25, couchY + 15, 35, 35);

    // Sleeping Black Cat on Couch
    ctx.fillStyle = '#111111';
    ctx.beginPath();
    ctx.ellipse(couchX + 120, couchY + 30, 22, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(couchX + 100, couchY + 26, 10, 0, Math.PI * 2);
    ctx.fill();

    // Coffee Table & Patterned Orange Rug
    ctx.fillStyle = '#b93817';
    ctx.fillRect(couchX + 25, couchY + 100, 200, 75);
    ctx.fillStyle = '#d97706';
    ctx.fillRect(couchX + 35, couchY + 110, 180, 55);

    ctx.fillStyle = '#22252a';
    ctx.fillRect(couchX + 70, couchY + 115, 110, 45);

    // Framed Fish Art on Left Wall
    ctx.fillStyle = '#b7950b';
    ctx.fillRect(x + 80, y + 120, 130, 120);
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(x + 92, y + 132, 106, 96);
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.ellipse(x + 145, y + 180, 32, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 165, y + 180);
    ctx.lineTo(x + 185, y + 165);
    ctx.lineTo(x + 185, y + 195);
    ctx.closePath();
    ctx.fill();

    // Grandfather Clock
    ctx.fillStyle = '#451a03';
    ctx.fillRect(cx - 150, y + 210, 35, 120);
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(cx - 132, y + 230, 12, 0, Math.PI * 2);
    ctx.fill();

    // Round Grey Rug with Armchairs (Right Side)
    const rigX = cx + 80;
    const rigY = y + 360;
    ctx.fillStyle = '#a3a3a3';
    ctx.beginPath();
    ctx.ellipse(rigX + 70, rigY + 60, 160, 90, 0, 0, Math.PI * 2);
    ctx.fill();

    // Orange Armchair
    ctx.fillStyle = '#ea580c';
    ctx.fillRect(rigX + 40, rigY - 20, 95, 80);
    ctx.fillStyle = '#c2410c';
    ctx.fillRect(rigX + 50, rigY - 45, 75, 30);

    // Green Armchair
    ctx.fillStyle = '#15803d';
    ctx.fillRect(rigX - 30, rigY + 50, 85, 70);

    // Small Tea Table
    ctx.fillStyle = '#78350f';
    ctx.fillRect(rigX + 110, rigY + 60, 70, 45);
    ctx.fillStyle = '#111827'; ctx.beginPath(); ctx.arc(rigX + 135, rigY + 78, 8, 0, Math.PI * 2); ctx.fill();

    // Stone Fireplace & Chimney (Right Wall)
    const fpX = x + w - 140;
    const fpY = y + 150;
    ctx.fillStyle = '#78350f';
    ctx.fillRect(fpX, fpY + 120, 110, 160);
    ctx.fillStyle = '#d4d4d8';
    ctx.fillRect(fpX + 20, y + 60, 70, 210);

    ctx.fillStyle = '#1c1917';
    ctx.fillRect(fpX + 25, fpY + 200, 60, 80);
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.arc(fpX + 55, fpY + 255, 16, 0, Math.PI * 2);
    ctx.fill();

    // Chandelier
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(cx + 80, y + 80, 75, 20, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Exit Door Area
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(cx - 40, y + h - 35, 80, 35);
    ctx.fillStyle = '#f59e0b';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('EXIT (E)', cx - 22, y + h - 12);
  }

  function drawStickman(ctx, x, y, name, hat, isSitting, facingRight) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, isSitting ? 2 : 22, 10, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (!isSitting) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;

      ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(-6, 22); ctx.moveTo(0, 5); ctx.lineTo(6, 22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(facingRight ? 10 : -10, 4); ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, -18, 8, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(facingRight ? 8 : -8, 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 0); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, -26, 8, 0, Math.PI * 2); ctx.fill();
    }

    const headY = isSitting ? -26 : -18;
    if (hat === 'cowboy') {
      ctx.fillStyle = '#b45309';
      ctx.beginPath(); ctx.ellipse(0, headY - 8, 14, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-7, headY - 16, 14, 9);
    } else if (hat === 'beanie') {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(0, headY - 7, 8, Math.PI, 0, false); ctx.fill();
    } else if (hat === 'wizard') {
      ctx.fillStyle = '#8b5cf6';
      ctx.beginPath(); ctx.moveTo(0, headY - 24); ctx.lineTo(-10, headY - 6); ctx.lineTo(10, headY - 6); ctx.closePath(); ctx.fill();
    }

    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(name, 0, isSitting ? -38 : -30);

    ctx.restore();
  }

  const remotePlayers = {};
  if (db) {
    db.ref('players').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      const count = Object.keys(data).length;
      document.getElementById('activeCampers').innerText = count + (count === 1 ? ' Camper Active' : ' Campers Active');

      Object.keys(data).forEach(id => {
        if (id === playerId) return;
        remotePlayers[id] = data[id];
      });
      Object.keys(remotePlayers).forEach(id => {
        if (!data[id]) delete remotePlayers[id];
      });
    });
  }

  let fireAnim = 0;
  function gameLoop() {
    fireAnim += 0.08;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    if (gameStarted && !myPlayer.isSitting) {
      if (keys['w'] || keys['arrowup']) myPlayer.y -= myPlayer.speed;
      if (keys['s'] || keys['arrowdown']) myPlayer.y += myPlayer.speed;
      if (keys['a'] || keys['arrowleft']) { myPlayer.x -= myPlayer.speed; myPlayer.facing = 'left'; }
      if (keys['d'] || keys['arrowright']) { myPlayer.x += myPlayer.speed; myPlayer.facing = 'right'; }

      if (playerRef) {
        playerRef.set({
          x: myPlayer.x,
          y: myPlayer.y,
          name: playerName,
          hat: playerHat,
          isSitting: myPlayer.isSitting,
          inCabin: inCabin,
          facing: myPlayer.facing
        }).catch(e => {});
      }
    }

    const camX = cx - myPlayer.x;
    const camY = cy - myPlayer.y;

    ctx.save();
    ctx.translate(camX, camY);

    if (!inCabin) {
      trees.forEach(t => drawTree(ctx, t.x + cx, t.y + cy, t.scale));

      ctx.fillStyle = '#78350f';
      ctx.fillRect(cx + 120, cy - 200, 160, 120);
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.moveTo(cx + 100, cy - 200);
      ctx.lineTo(cx + 200, cy - 250);
      ctx.lineTo(cx + 300, cy - 200);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(cx + 185, cy - 130, 30, 50);
      ctx.fillStyle = '#f59e0b';
      ctx.font = '10px sans-serif';
      ctx.fillText('DOOR (E)', cx + 180, cy - 140);

      logs.forEach(log => {
        ctx.save();
        ctx.translate(cx + log.offsetX, cy + log.offsetY);
        ctx.rotate(log.angle);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-30, -10, 60, 20);
        ctx.restore();
      });

      const glow = ctx.createRadialGradient(cx, cy, 5, cx, cy, 70);
      glow.addColorStop(0, 'rgba(245, 158, 11, 0.5)');
      glow.addColorStop(1, 'rgba(245, 158, 11, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, 70, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.arc(cx, cy, 14 + Math.sin(fireAnim * 2) * 3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      drawCabinInteriorDetailed(ctx, cx, cy);
    }

    Object.keys(remotePlayers).forEach(id => {
      const p = remotePlayers[id];
      if (!!p.inCabin === inCabin) {
        drawStickman(ctx, p.x, p.y, p.name || 'Camper', p.hat || 'none', p.isSitting, p.facing === 'right');
      }
    });

    drawStickman(ctx, myPlayer.x, myPlayer.y, playerName, playerHat, myPlayer.isSitting, myPlayer.facing === 'right');

    ctx.restore();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
