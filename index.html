<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiener Dog Camp - New Lakefront Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #070a12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Start Screen Modal Overlay */
    #startModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(7, 10, 18, 0.96);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }

    .modal-card {
      background: #111827;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 32px;
      border-radius: 20px;
      text-align: center;
      width: 380px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(245, 158, 11, 0.15);
    }

    .modal-card h1 {
      color: #f59e0b;
      font-size: 26px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .modal-card p {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 6px;
      display: block;
    }

    .modal-input {
      width: 100%;
      padding: 12px 14px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }

    .modal-input:focus {
      border-color: #f59e0b;
    }

    .selection-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .select-btn {
      background: #1f2937;
      border: 2px solid #374151;
      border-radius: 10px;
      padding: 10px 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #9ca3af;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .select-btn.selected {
      border-color: #f59e0b;
      color: #ffffff;
      background: #374151;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }

    .hat-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .start-btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }

    /* HUD Controls */
    .hud-top {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 18px;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .hud-controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 13px;
      color: #d1d5db;
      z-index: 10;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Start Screen Modal -->
  <div id="startModal">
    <div class="modal-card">
      <h1>🌭 Lakefront Camp 🌭</h1>
      <p>Customize your dachshund & explore the lakefront!</p>
      
      <div class="form-group">
        <label class="form-label">Dog Name:</label>
        <input type="text" id="playerNameInput" class="modal-input" placeholder="Name your dog..." maxlength="12" value="Mr. Weens">
      </div>

      <div class="form-group">
        <label class="form-label">Choose Dog Breed Coat:</label>
        <div class="selection-grid">
          <button class="select-btn breed-btn selected" data-breed="black_tan" onclick="selectBreed('black_tan', this)">
            🐾 Black & Tan
          </button>
          <button class="select-btn breed-btn" data-breed="red_tan" onclick="selectBreed('red_tan', this)">
            🐕 Red / Tan
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Choose Hat:</label>
        <div class="selection-grid hat-grid">
          <button class="select-btn hat-btn selected" data-hat="none" onclick="selectHat('none', this)">None</button>
          <button class="select-btn hat-btn" data-hat="cowboy" onclick="selectHat('cowboy', this)">🤠 Cowboy</button>
          <button class="select-btn hat-btn" data-hat="beanie" onclick="selectHat('beanie', this)">🧢 Beanie</button>
          <button class="select-btn hat-btn" data-hat="wizard" onclick="selectHat('wizard', this)">🧙‍♂️ Wizard</button>
        </div>
      </div>

      <button class="start-btn" id="enterBtn" onclick="enterGame()">Enter Lakefront 🌲</button>
    </div>
  </div>

  <!-- HUD Overlay -->
  <div class="hud-top">
    <div style="font-weight: 800; color: #f59e0b; font-size: 15px; display: flex; align-items: center; gap: 6px;">
      <span>🌊</span> Lakefront Wiener Camp
    </div>
    <div style="font-size: 12px; color: #10b981; margin-top: 2px;" id="activeCampers">1 Dachshund Online</div>
  </div>

  <div class="hud-controls-hint">
    Move: <b>WASD / Arrows</b> • Hop on Log / Enter Door: <b>Press E</b>
  </div>

  <canvas id="gameCanvas"></canvas>

<script>
  let db = null;
  const firebaseConfig = {
    apiKey: "AIzaSyACp-ZSaVYaUJEIxGNKTuFSXJkq9RPC0fA",
    authDomain: "cursor-camp-788be.firebaseapp.com",
    databaseURL: "https://cursor-camp-788be-default-rtdb.firebaseio.com",
    projectId: "cursor-camp-788be",
    storageBucket: "cursor-camp-788be.firebasestorage.app",
    messagingSenderId: "840054967773",
    appId: "1:840054967773:web:67a52ff630cc2ab3687a34",
    measurementId: "G-YQPWH70W4G"
  };

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    console.log("Offline mode active");
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let gameStarted = false;
  let playerName = "Mr. Weens";
  let dogBreed = "black_tan";
  let playerHat = "none";
  let inCabin = false;
  const playerId = 'player_' + Math.random().toString(36).substr(2, 9);
  let playerRef = null;

  if (db) {
    playerRef = db.ref('players/' + playerId);
    playerRef.onDisconnect().remove();
  }

  const myPlayer = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2 + 80,
    speed: 3.8,
    isSitting: false,
    facing: 'right',
    animFrame: 0
  };

  function selectBreed(breed, element) {
    dogBreed = breed;
    document.querySelectorAll('.breed-btn').forEach(b => b.classList.remove('selected'));
    element.classList.add('selected');
  }

  function selectHat(hat, element) {
    playerHat = hat;
    document.querySelectorAll('.hat-btn').forEach(b => b.classList.remove('selected'));
    element.classList.add('selected');
  }

  function enterGame() {
    const nameVal = document.getElementById('playerNameInput').value.trim();
    if (nameVal) playerName = nameVal;
    
    // Complete element removal fix
    const modal = document.getElementById('startModal');
    if (modal) modal.remove();
    gameStarted = true;
  }

  document.getElementById('playerNameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enterGame();
  });

  // World objects setup
  const logs = [
    { offsetX: 0, offsetY: -60, angle: 0 },
    { offsetX: 60, offsetY: 0, angle: Math.PI / 2 },
    { offsetX: 0, offsetY: 60, angle: Math.PI },
    { offsetX: -60, offsetY: 0, angle: (3 * Math.PI) / 2 }
  ];

  const trees = [];
  for (let i = 0; i < 40; i++) {
    trees.push({
      x: (Math.random() * 2 - 0.5) * 2200,
      y: (Math.random() * 2 - 0.5) * 2200,
      scale: Math.random() * 0.4 + 0.8
    });
  }

  const fireflies = [];
  for (let i = 0; i < 30; i++) {
    fireflies.push({
      x: Math.random() * 2000 - 1000,
      y: Math.random() * 2000 - 1000,
      speedX: (Math.random() - 0.5) * 0.6,
      speedY: (Math.random() - 0.5) * 0.6,
      phase: Math.random() * Math.PI * 2
    });
  }

  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'e' && gameStarted) {
      handleInteract();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function handleInteract() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    if (!inCabin) {
      // New Cabin Door location
      const cabinDoorX = cx + 250;
      const cabinDoorY = cy - 110;
      if (Math.hypot(myPlayer.x - cabinDoorX, myPlayer.y - cabinDoorY) < 70) {
        inCabin = true;
        myPlayer.x = cx;
        myPlayer.y = cy + 180;
        return;
      }

      if (myPlayer.isSitting) {
        myPlayer.isSitting = false;
        myPlayer.y += 25;
      } else {
        logs.forEach((log) => {
          const lx = cx + log.offsetX;
          const ly = cy + log.offsetY;
          if (Math.hypot(myPlayer.x - lx, myPlayer.y - ly) < 48) {
            myPlayer.isSitting = true;
            myPlayer.x = lx;
            myPlayer.y = ly - 4;
          }
        });
      }
    } else {
      if (myPlayer.y > cy + 200) {
        inCabin = false;
        myPlayer.x = cx + 250;
        myPlayer.y = cy - 70;
      }
    }
  }

  // Realistic Dachshund Character Drawer
  function drawDachshund(ctx, x, y, name, breed, hat, isSitting, facingRight, isMoving, animTime) {
    ctx.save();
    ctx.translate(x, y);

    const scale = 1.1;
    ctx.scale(facingRight ? scale : -scale, scale);

    let bodyColor = '#1e1b18'; 
    let tanColor = '#c27838';  
    if (breed === 'red_tan') {
      bodyColor = '#a84c24';  
      tanColor = '#e29752';   
    }

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 16, 26, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    if (!isSitting) {
      // Tail
      const tailWag = isMoving ? Math.sin(animTime * 12) * 0.35 : Math.sin(animTime * 2) * 0.1;
      ctx.save();
      ctx.translate(-22, -2);
      ctx.rotate(-0.4 + tailWag);
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(-12, -3, 14, 6, 3);
      ctx.fill();
      ctx.restore();

      // Back Legs
      const legWalk1 = isMoving ? Math.sin(animTime * 10) * 6 : 0;
      const legWalk2 = isMoving ? -Math.sin(animTime * 10) * 6 : 0;

      ctx.fillStyle = bodyColor;
      ctx.fillRect(-16 + legWalk1, 6, 5, 11);
      ctx.fillRect(-8 + legWalk2, 6, 5, 11);

      ctx.fillStyle = tanColor;
      ctx.fillRect(-16 + legWalk1, 14, 6, 3);
      ctx.fillRect(-8 + legWalk2, 14, 6, 3);

      // Long Body
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(-22, -8, 44, 18, 9);
      ctx.fill();

      // Chest
      ctx.fillStyle = tanColor;
      ctx.beginPath();
      ctx.ellipse(14, 3, 7, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Front Legs
      ctx.fillStyle = bodyColor;
      ctx.fillRect(8 - legWalk1, 6, 5, 11);
      ctx.fillRect(16 - legWalk2, 6, 5, 11);

      ctx.fillStyle = tanColor;
      ctx.fillRect(8 - legWalk1, 14, 6, 3);
      ctx.fillRect(16 - legWalk2, 14, 6, 3);

      // Head
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.ellipse(18, -8, 8, 10, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(22, -14, 10, 0, Math.PI * 2);
      ctx.fill();

      // Snout
      ctx.beginPath();
      ctx.roundRect(22, -18, 16, 9, 4);
      ctx.fill();

      ctx.fillStyle = tanColor;
      ctx.fillRect(26, -14, 10, 5); 
      ctx.beginPath(); ctx.arc(21, -19, 2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#0f0f10';
      ctx.beginPath(); ctx.arc(37, -15, 2.5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(24, -16, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath(); ctx.arc(24.5, -16, 1.2, 0, Math.PI * 2); ctx.fill();

      // Ear
      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.ellipse(16, -11, 6, 13, 0.2, 0, Math.PI * 2); ctx.fill();
    } else {
      // Sitting Pose
      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.ellipse(-2, 2, 16, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -14, 10, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.roundRect(4, -18, 15, 8, 4); ctx.fill();

      ctx.fillStyle = tanColor;
      ctx.fillRect(8, -14, 9, 4);
      ctx.beginPath(); ctx.arc(3, -19, 2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath(); ctx.arc(19, -15, 2.5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.ellipse(-2, -11, 6, 12, 0.1, 0, Math.PI * 2); ctx.fill();
    }

    // Hats Render
    const headX = isSitting ? 4 : 22;
    const headY = isSitting ? -14 : -14;

    if (hat === 'cowboy') {
      ctx.fillStyle = '#b45309';
      ctx.beginPath(); ctx.ellipse(headX - 2, headY - 8, 14, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(headX - 8, headY - 16, 12, 9);
    } else if (hat === 'beanie') {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(headX - 2, headY - 6, 8, Math.PI, 0, false); ctx.fill();
    } else if (hat === 'wizard') {
      ctx.fillStyle = '#8b5cf6';
      ctx.beginPath(); ctx.moveTo(headX - 2, headY - 24); ctx.lineTo(headX - 12, headY - 6); ctx.lineTo(headX + 8, headY - 6); ctx.closePath(); ctx.fill();
    }

    ctx.restore();

    // Name Tag
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#f59e0b';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(name, 0, isSitting ? -36 : -32);
    ctx.restore();
  }

  function drawTree(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 25, 20, 8, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#3d2817'; ctx.fillRect(-5, 10, 10, 22);

    ctx.fillStyle = '#064e3b';
    ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(-30, 15); ctx.lineTo(30, 15); ctx.fill();

    ctx.fillStyle = '#047857';
    ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(-24, -2); ctx.lineTo(24, -2); ctx.fill();

    ctx.fillStyle = '#10b981';
    ctx.beginPath(); ctx.moveTo(0, -58); ctx.lineTo(-16, -16); ctx.lineTo(16, -16); ctx.fill();

    ctx.restore();
  }

  // BRAND NEW LAKEFRONT CABIN EXTERIOR
  function drawNewCabinExterior(ctx, x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Stone Foundation
    ctx.fillStyle = '#475569';
    ctx.fillRect(-10, 50, 220, 20);

    // Main Log Walls
    ctx.fillStyle = '#451a03';
    ctx.fillRect(0, -90, 200, 140);

    // Horizontal Log Lines
    ctx.strokeStyle = '#27100b';
    ctx.lineWidth = 3;
    for (let ly = -80; ly <= 40; ly += 16) {
      ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(200, ly); ctx.stroke();
    }

    // Sloped Roof
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.moveTo(-20, -90);
    ctx.lineTo(100, -150);
    ctx.lineTo(220, -90);
    ctx.closePath();
    ctx.fill();

    // Front Porch Platform
    ctx.fillStyle = '#78350f';
    ctx.fillRect(20, 10, 160, 40);
    ctx.strokeStyle = '#451a03';
    ctx.lineWidth = 2;
    ctx.strokeRect(20, 10, 160, 40);

    // Porch Railing
    ctx.strokeStyle = '#9a3412';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(20, 15); ctx.lineTo(65, 15);
    ctx.moveTo(135, 15); ctx.lineTo(180, 15);
    ctx.stroke();

    // Double Glass Entrance Door
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(7
