<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Camp</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      cursor: crosshair;
    }

    /* Style for other players' cursors */
    .other-player-cursor {
      position: fixed;
      width: 16px;
      height: 16px;
      background: #ff4757;
      border: 2px solid #ffffff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: left 0.05s linear, top 0.05s linear;
      box-shadow: 0 0 10px rgba(255, 71, 87, 0.8);
    }
  </style>

  <!-- Load Firebase Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<script>
  // Your exact Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyACp-ZSaVYaUJEIxGNKTuFSXJkq9RPC0fA",
    authDomain: "cursor-camp-788be.firebaseapp.com",
    databaseURL: "https://cursor-camp-788be-default-rtdb.firebaseio.com",
    projectId: "cursor-camp-788be",
    storageBucket: "cursor-camp-788be.firebasestorage.app",
    messagingSenderId: "840054967773",
    appId: "1:840054967773:web:67a52ff630cc2ab3687a34",
    measurementId: "G-YQPWH70W4G"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Create a unique ID for this player session
  const playerId = 'player_' + Math.random().toString(36).substr(2, 9);
  const playerRef = db.ref('players/' + playerId);

  // Send mouse position on move
  window.addEventListener('mousemove', (e) => {
    playerRef.set({
      x: e.clientX,
      y: e.clientY,
      lastSeen: Date.now()
    });
  });

  // Automatically delete cursor when player closes the tab/leaves
  playerRef.onDisconnect().remove();

  // Listen for other players moving
  const otherCursors = {};
  db.ref('players').on('value', (snapshot) => {
    const players = snapshot.val() || {};

    Object.keys(players).forEach((id) => {
      if (id === playerId) return; // Ignore local player

      let el = otherCursors[id];
      if (!el) {
        // Spawn cursor for new player
        el = document.createElement('div');
        el.className = 'other-player-cursor';
        document.body.appendChild(el);
        otherCursors[id] = el;
      }

      // Update cursor position
      el.style.left = players[id].x + 'px';
      el.style.top = players[id].y + 'px';
    });

    // Remove cursors of players who disconnected
    Object.keys(otherCursors).forEach((id) => {
      if (!players[id]) {
        otherCursors[id].remove();
        delete otherCursors[id];
      }
    });
  });
</script>

</body>
</html>
