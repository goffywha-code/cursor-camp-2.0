<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wiener Dog Camp - Ultimate Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #070a12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: relative;
      transition: transform 0.4s ease;
    }

    body.flipped {
      transform: rotate(180deg);
    }

    /* Start Screen Modal Overlay */
    #startModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(7, 10, 18, 0.96);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: auto;
      overflow-y: auto;
      padding: 16px;
    }

    .modal-card {
      background: #111827;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(245, 158, 11, 0.15);
      position: relative;
      z-index: 100000;
    }

    .modal-card h1 {
      color: #f59e0b;
      font-size: 24px;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .modal-card p {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 6px;
      display: block;
    }

    .modal-input {
      width: 100%;
      padding: 10px 14px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }

    .modal-input:focus {
      border-color: #f59e0b;
    }

    /* Code Success Feedback Label */
    #codeFeedback {
      font-size: 12px;
      font-weight: bold;
      color: #10b981;
      margin-top: 4px;
      display: none;
      text-align: center;
      animation: fadeIn 0.2s ease;
    }

    .selection-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .select-btn {
      background: #1f2937;
      border: 2px solid #374151;
      border-radius: 10px;
      padding: 10px 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #9ca3af;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .select-btn.selected {
      border-color: #f59e0b;
      color: #ffffff;
      background: #374151;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }

    .hat-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .start-btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      z-index: 100001;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }

    /* HUD Controls */
    .hud-top {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 18px;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .hud-controls-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 12px;
      color: #d1d5db;
      z-index: 10;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      white-space: nowrap;
    }

    /* Top Right Buttons container for Mobile Only */
    .top-right-hud {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 60;
    }

    .top-hud-btn {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid #f59e0b;
      color: #f59e0b;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(6px);
      display: none;
    }

    /* Roblox-style Chat Box UI */
    #chatContainer {
      position: absolute;
      bottom: 70px;
      left: 16px;
      width: 280px;
      max-height: 180px;
      display: flex;
      flex-direction: column;
      z-index: 20;
      pointer-events: none;
    }

    #chatLog {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      margin-bottom: 8px;
      pointer-events: auto;
    }

    .chat-message-item {
      background: rgba(15, 23, 42, 0.85);
      border-left: 3px solid #f59e0b;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #e2e8f0;
      backdrop-filter: blur(4px);
      word-break: break-word;
      animation: fadeIn 0.2s ease;
    }

    .chat-message-item span {
      font-weight: bold;
      color: #f59e0b;
    }

    #chatInputBox {
      width: 100%;
      padding: 10px 14px;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
      backdrop-filter: blur(6px);
      pointer-events: auto;
      display: none;
    }

    #chatInputBox:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    /* On-Screen Mobile Touch Controls */
    #mobileHUD {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
      display: none;
    }

    .dpad-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 140px;
      height: 140px;
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
    }

    .dpad-btn {
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      touch-action: manipulation;
    }

    .dpad-btn:active {
      background: rgba(245, 158, 11, 0.8);
      color: #0f172a;
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }

    .action-buttons {
      position: absolute;
      bottom: 25px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }

    .action-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(31, 41, 55, 0.85);
      border: 2px solid rgba(245, 158, 11, 0.6);
      color: #f59e0b;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      touch-action: manipulation;
    }

    .action-btn:active {
      background: #f59e0b;
      color: #0f172a;
      transform: scale(0.95);
    }

    .action-btn span {
      font-size: 18px;
    }

    /* Kick Screen Overlay */
    #kickOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.96);
      z-index: 999999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #kickOverlay h1 {
      color: #ef4444;
      font-size: 48px;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }
    #kickOverlay p {
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 24px;
    }
    .refresh-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Start Screen Modal Overlay -->
  <div id="startModal">
    <div class="modal-card">
      <h1>🌭 Lakefront Camp 🌭</h1>
      <p>Customize your dachshund & select your controls!</p>
      
      <div class="form-group">
        <label class="form-label">Dog Name:</label>
        <input type="text" id="playerNameInput" class="modal-input" placeholder="Name your dog..." maxlength="12" value="Mr. Weens">
      </div>

      <div class="form-group">
        <label class="form-label">Codes:</label>
        <input type="text" id="codeMenuInput" class="modal-input" placeholder="Codes..." oninput="checkCodeInput(this)">
        <div id="codeFeedback">✅ Success! Code activated!</div>
      </div>

      <div class="form-group">
        <label class="form-label">Select Device Mode:</label>
        <div class="selection-grid">
          <button type="button" class="select-btn device-btn selected" data-device="pc" onclick="selectDevice('pc', this)">
            💻 PC (Keyboard)
          </button>
          <button type="button" class="select-btn device-btn" data-device="mobile" onclick="selectDevice('mobile', this)">
            📱 Mobile (Touch)
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Choose Dog Breed Coat:</label>
        <div class="selection-grid">
          <button type="button" class="select-btn breed-btn selected" data-breed="black_tan" onclick="selectBreed('black_tan', this)">
            🐾 Black & Tan
          </button>
          <button type="button" class="select-btn breed-btn" data-breed="red_tan" onclick="selectBreed('red_tan', this)">
            🐕 Red / Tan
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Choose Hat:</label>
        <div class="selection-grid hat-grid">
          <button type="button" class="select-btn hat-btn selected" data-hat="none" onclick="selectHat('none', this)">None</button>
          <button type="button" class="select-btn hat-btn" data-hat="cowboy" onclick="selectHat('cowboy', this)">🤠 Cowboy</button>
          <button type="button" class="select-btn hat-btn" data-hat="beanie" onclick="selectHat('beanie', this)">🧢 Beanie</button>
          <button type="button" class="select-btn hat-btn" data-hat="wizard" onclick="selectHat('wizard', this)">🧙‍♂️ Wizard</button>
        </div>
      </div>

      <button type="button" class="start-btn" id="enterBtn">Enter Lakefront 🌲</button>
    </div>
  </div>

  <!-- Kicked Screen Overlay -->
  <div id="kickOverlay">
    <h1>🚫 YOU GOT KICKED!</h1>
    <p>The host used the Skibidi power to clear the server.</p>
    <button class="refresh-btn" onclick="window.location.reload()">REFRESH PAGE NOW</button>
  </div>

  <!-- HUD Overlay -->
  <div class="hud-top">
    <div style="font-weight: 800; color: #f59e0b; font-size: 15px; display: flex; align-items: center; gap: 6px;">
      <span>🌊</span> Lakefront Wiener Camp
    </div>
    <div style="font-size: 12px; color: #10b981; margin-top: 2px;" id="activeCampers">1 Dachshund Online</div>
  </div>

  <div class="hud-controls-hint" id="hudHint">
    Move: <b>WASD / Arrows</b> • Chat: Press <b>/</b> • Menu: Press <b>ESC</b>
  </div>

  <!-- Top Right Buttons (Mobile Only) -->
  <div class="top-right-hud">
    <button type="button" id="btnMenu" class="top-hud-btn" onclick="openMenu()">⚙️ Menu</button>
    <button type="button" id="btnFlip" class="top-hud-btn" onclick="toggleFlipScreen()">🔄 FLIP</button>
  </div>

  <!-- Roblox-style Chat Overlay -->
  <div id="chatContainer">
    <div id="chatLog"></div>
    <input type="text" id="chatInputBox" placeholder="Press '/' to chat, 'Enter' to send..." maxlength="80">
  </div>

  <!-- Mobile On-Screen Touch Controls -->
  <div id="mobileHUD">
    <div class="dpad-container">
      <div class="dpad-btn dpad-up" id="btnUp">▲</div>
      <div class="dpad-btn dpad-left" id="btnLeft">◄</div>
      <div class="dpad-btn dpad-right" id="btnRight">►</div>
      <div class="dpad-btn dpad-down" id="btnDown">▼</div>
    </div>
    <div class="action-buttons">
      <button type="button" class="action-btn" id="btnChat">
        <span>💬</span> CHAT
      </button>
      <button type="button" class="action-btn" id="btnInteract">
        <span>🐾</span> USE
      </button>
      <button type="button" class="action-btn" id="btnKick" style="display:none; background: #ef4444; border-color: #f87171; color: #fff;" onclick="triggerGlobalKick()">
        <span>👢</span> KICK
      </button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

<script>
  let db = null;
  const firebaseConfig = {
    apiKey: "AIzaSyACp-ZSaVYaUJEIxGNKTuFSXJkq9RPC0fA",
    authDomain: "cursor-camp-788be.firebaseapp.com",
    databaseURL: "https://cursor-camp-788be-default-rtdb.firebaseio.com",
    projectId: "cursor-camp-788be",
    storageBucket: "cursor-camp-788be.firebasestorage.app",
    messagingSenderId: "840054967773",
    appId: "1:840054967773:web:67a52ff630cc2ab3687a34",
    measurementId: "G-YQPWH70W4G"
  };

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    console.log("Offline mode active");
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let gameStarted = false;
  let deviceMode = 'pc';
  let playerName = "Mr. Weens";
  let dogBreed = "black_tan";
  let playerHat = "none";
  let inCabin = false;
  let isSonic = false;
  let hasLove = false;
  let canKick = false;
  let isFlipped = false;
  const sessionStartTime = Date.now();
  const playerId = 'player_' + Math.random().toString(36).substr(2, 9);
  let playerRef = null;
  let kickEventRef = null;

  if (db) {
    playerRef = db.ref('players/' + playerId);
    playerRef.onDisconnect().remove();

    kickEventRef = db.ref('system/kickEvent');
    kickEventRef.on('value', (snapshot) => {
      const val = snapshot.val();
      if (val && val.sender !== playerId && val.time > sessionStartTime) {
        document.getElementById('kickOverlay').style.display = 'flex';
        gameStarted = false;
        if (playerRef) playerRef.remove();
      }
    });
  }

  const myPlayer = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2 + 80,
    speed: 3.8,
    isSitting: false,
    facing: 'right',
    animFrame: 0,
    currentMsg: "",
    msgTimer: 0
  };

  function selectDevice(device, element) {
    deviceMode = device;
    document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('selected'));
    element.classList.add('selected');
  }

  function selectBreed(breed, element) {
    dogBreed = breed;
    document.querySelectorAll('.breed-btn').forEach(b => b.classList.remove('selected'));
    element.classList.add('selected');
  }

  function selectHat(hat, element) {
    playerHat = hat;
    document.querySelectorAll('.hat-btn').forEach(b => b.classList.remove('selected'));
    element.classList.add('selected');
  }

  function checkCodeInput(inputElem) {
    const codeVal = inputElem.value.trim().toUpperCase();
    const feedback = document.getElementById('codeFeedback');
    if (codeVal === 'SONIC1' || codeVal === 'SKIBIDI' || codeVal === 'LOVE') {
      feedback.style.display = 'block';
    } else {
      feedback.style.display = 'none';
    }
  }

  function toggleFlipScreen() {
    isFlipped = !isFlipped;
    const root = document.getElementById('htmlRoot');
    if (isFlipped) {
      root.classList.add('flipped');
    } else {
      root.classList.remove('flipped');
    }
  }

  function openMenu() {
    gameStarted = false;
    if (playerRef) playerRef.remove();
    
    const modal = document.getElementById('startModal');
    if (modal) {
      modal.style.display = 'flex';
    } else {
      window.location.reload();
    }
  }

  function triggerGlobalKick() {
    if (!canKick || !db) return;
    if (confirm('Are you sure you want to kick everyone from the server?')) {
      db.ref('system/kickEvent').set({ sender: playerId, time: Date.now() });
      setTimeout(() => {
        db.ref('system/kickEvent').remove();
      }, 2000);
    }
  }

  function enterGame() {
    const nameVal = document.getElementById('playerNameInput').value.trim();
    if (nameVal) playerName = nameVal;

    const codeVal = document.getElementById('codeMenuInput').value.trim().toUpperCase();
    if (codeVal === 'SONIC1') {
      isSonic = true;
      myPlayer.speed = 7.2;
    } else if (codeVal === 'SKIBIDI') {
      canKick = true;
    } else if (codeVal === 'LOVE') {
      hasLove = true;
    }

    if (deviceMode === 'mobile') {
      document.getElementById('mobileHUD').style.display = 'block';
      document.getElementById('btnFlip').style.display = 'block';
      document.getElementById('btnMenu').style.display = 'block';
      document.getElementById('hudHint').innerText = "Use D-Pad to move • Tap Menu for settings";
      document.getElementById('chatContainer').style.bottom = '175px';
      if (canKick) document.getElementById('btnKick').style.display = 'flex';
    } else {
      document.getElementById('mobileHUD').style.display = 'none';
      document.getElementById('btnFlip').style.display = 'none';
      document.getElementById('btnMenu').style.display = 'none';
      document.getElementById('hudHint').innerHTML = "Move: <b>WASD / Arrows</b> • Chat: Press <b>/</b> • Menu: Press <b>ESC</b>";
    }

    const modal = document.getElementById('startModal');
    if (modal) modal.style.display = 'none';
    gameStarted = true;
  }

  document.getElementById('enterBtn').addEventListener('click', enterGame);
  document.getElementById('playerNameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enterGame();
  });

  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    const mobileBtn = document.querySelector('.device-btn[data-device="mobile"]');
    if (mobileBtn) selectDevice('mobile', mobileBtn);
  }

  // ROBLOX CHAT SYSTEM & ESCAPE KEY MENU LOGIC
  const chatInput = document.getElementById('chatInputBox');
  const chatLog = document.getElementById('chatLog');
  let isChatting = false;

  function openChat() {
    if (!gameStarted || isChatting) return;
    isChatting = true;
    chatInput.style.display = 'block';
    chatInput.focus();
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (isChatting) {
        closeChat();
      } else {
        openMenu();
      }
      return;
    }

    if (!gameStarted) return;
    if (e.key === '/' && !isChatting) {
      e.preventDefault();
      openChat();
    }
    if (e.key.toLowerCase() === 'i' && canKick && !isChatting) {
      triggerGlobalKick();
    }
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      sendChatMessage();
    } else if (e.key === 'Escape') {
      closeChat();
    }
  });

  function sendChatMessage() {
    const text = chatInput.value.trim();
    if (text && db) {
      db.ref('chats').push({
        name: playerName,
        text: text,
        timestamp: Date.now()
      });

      myPlayer.currentMsg = text;
      myPlayer.msgTimer = 240;
    }
    closeChat();
  }

  function closeChat() {
    chatInput.value = '';
    chatInput.style.display = 'none';
    isChatting = false;
    canvas.focus();
  }

  if (db) {
    db.ref('chats').limitToLast(15).on('child_added', (snapshot) => {
      const msg = snapshot.val();
      if (!msg) return;

      const item = document.createElement('div');
      item.className = 'chat-message-item';
      item.innerHTML = `<span>${msg.name}:</span> ${msg.text}`;
      chatLog.appendChild(item);
      chatLog.scrollTop = chatLog.scrollHeight;

      if (chatLog.children.length > 20) {
        chatLog.removeChild(chatLog.firstChild);
      }
    });
  }

  // CONTROLS & INTERACTION
  const keys = {};
  const mobileKeys = { up: false, down: false, left: false, right: false };

  window.addEventListener('keydown', (e) => {
    if (isChatting) return;
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'e' && gameStarted) {
      handleInteract();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function bindTouchBtn(btnId, keyName) {
    const btn = document.getElementById(btnId);
    if(!btn) return;
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); mobileKeys[keyName] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); mobileKeys[keyName] = false; });
    btn.addEventListener('mousedown', () => { mobileKeys[keyName] = true; });
    btn.addEventListener('mouseup', () => { mobileKeys[keyName] = false; });
  }

  bindTouchBtn('btnUp', 'up');
  bindTouchBtn('btnDown', 'down');
  bindTouchBtn('btnLeft', 'left');
  bindTouchBtn('btnRight', 'right');

  document.getElementById('btnInteract').addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInteract();
  });
  document.getElementById('btnInteract').addEventListener('click', handleInteract);

  document.getElementById('btnChat').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (isChatting) {
      sendChatMessage();
    } else {
      openChat();
    }
  });
  document.getElementById('btnChat').addEventListener('click', () => {
    if (!isChatting) openChat();
  });

  const logs = [
    { offsetX: 0, offsetY: -60, angle: 0 },
    { offsetX: 60, offsetY: 0, angle: Math.PI / 2 },
    { offsetX: 0, offsetY: 60, angle: Math.PI },
    { offsetX: -60, offsetY: 0, angle: (3 * Math.PI) / 2 }
  ];

  const trees = [];
  for (let i = 0; i < 40; i++) {
    trees.push({
      x: (Math.random() * 2 - 0.5) * 2200,
      y: (Math.random() * 2 - 0.5) * 2200,
      scale: Math.random() * 0.4 + 0.8
    });
  }

  const fireflies = [];
  for (let i = 0; i < 30; i++) {
    fireflies.push({
      x: Math.random() * 2000 - 1000,
      y: Math.random() * 2000 - 1000,
      speedX: (Math.random() - 0.5) * 0.6,
      speedY: (Math.random() - 0.5) * 0.6,
      phase: Math.random() * Math.PI * 2
    });
  }

  function handleInteract() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    if (!inCabin) {
      const cabinDoorX = cx + 250;
      const cabinDoorY = cy - 110;
      if (Math.hypot(myPlayer.x - cabinDoorX, myPlayer.y - cabinDoorY) < 70) {
        inCabin = true;
        myPlayer.x = cx;
        myPlayer.y = cy + 180;
        return;
      }

      if (myPlayer.isSitting) {
        myPlayer.isSitting = false;
        myPlayer.y += 25;
      } else {
        logs.forEach((log) => {
          const lx = cx + log.offsetX;
          const ly = cy + log.offsetY;
          if (Math.hypot(myPlayer.x - lx, myPlayer.y - ly) < 48) {
            myPlayer.isSitting = true;
            myPlayer.x = lx;
            myPlayer.y = ly - 4;
          }
        });
      }
    } else {
      if (myPlayer.y > cy + 200) {
        inCabin = false;
        myPlayer.x = cx + 250;
        myPlayer.y = cy - 70;
      }
    }
  }

  function drawDachshund(ctx, x, y, name, breed, hat, isSitting, facingRight, isMoving, animTime, chatMessage, sonicSkin, loveSkin) {
    ctx.save();
    ctx.translate(x, y);

    const scale = 1.1;
    ctx.scale(facingRight ? scale : -scale, scale);

    let bodyColor = sonicSkin ? '#1d4ed8' : '#1e1b18'; 
    let tanColor = sonicSkin ? '#93c5fd' : '#c27838';  
    if (breed === 'red_tan' && !sonicSkin) {
      bodyColor = '#a84c24';  
      tanColor = '#e29752';   
    }

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 16, 26, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    if (!isSitting) {
      const tailWag = isMoving ? Math.sin(animTime * 12) * 0.35 : Math.sin(animTime * 2) * 0.1;
      ctx.save();
      ctx.translate(-22, -2);
      ctx.rotate(-0.4 + tailWag);
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(-12, -3, 14, 6, 3);
      ctx.fill();
      ctx.restore();

      const legWalk1 = isMoving ? Math.sin(animTime * 10) * 6 : 0;
      const legWalk2 = isMoving ? -Math.sin(animTime * 10) * 6 : 0;

      ctx.fillStyle = bodyColor;
      ctx.fillRect(-16 + legWalk1, 6, 5, 11);
      ctx.fillRect(-8 + legWalk2, 6, 5, 11);

      ctx.fillStyle = sonicSkin ? '#ef4444' : tanColor;
      ctx.fillRect(-18 + legWalk1, 13, 8, 5);
      ctx.fillRect(-10 + legWalk2, 13, 8, 5);

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(-22, -8, 44, 18, 9);
      ctx.fill();

      ctx.fillStyle = tanColor;
      ctx.beginPath();
      ctx.ellipse(14, 3, 7, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = bodyColor;
      ctx.fillRect(8 - legWalk1, 6, 5, 11);
      ctx.fillRect(16 - legWalk2, 6, 5, 11);

      ctx.fillStyle = sonicSkin ? '#ef4444' : tanColor;
      ctx.fillRect(6 - legWalk1, 13, 8, 5);
      ctx.fillRect(14 - legWalk2, 13, 8, 5);

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.ellipse(18, -8, 8, 10, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(22, -14, 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.roundRect(22, -18, 16, 9, 4);
      ctx.fill();

      ctx.fillStyle = tanColor;
      ctx.fillRect(26, -14, 10, 5); 
      ctx.beginPath(); ctx.arc(21, -19, 2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#0f0f10';
      ctx.beginPath(); ctx.arc(37, -15, 2.5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(24, -16, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath(); ctx.arc(24.5, -16, 1.2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.ellipse(16, -11, 6, 13, 0.2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.ellipse(-2, 2, 16, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -14, 10, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.roundRect(4, -18, 15, 8, 4); ctx.fill();

      ctx.fillStyle = tanColor;
      ctx.fillRect(8, -14, 9, 4);
      ctx.beginPath(); ctx.arc(3, -19, 2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath(); ctx.arc(19, -15, 2.5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.ellipse(-2, -11, 6, 12, 0.1, 0, Math.PI * 2); ctx.fill();
    }

    const headX = isSitting ? 4 : 22;
    const headY = isSitting ? -14 : -14;

    if (sonicSkin) {
      ctx.fillStyle = '#1d4ed8';
      ctx.beginPath(); ctx.moveTo(headX - 6, headY - 18); ctx.lineTo(headX - 16, headY - 22); ctx.lineTo(headX - 8, headY - 12); ctx.fill();
      ctx.beginPath(); ctx.moveTo(headX - 4, headY - 14); ctx.lineTo(headX - 14, headY - 16); ctx.lineTo(headX - 6, headY - 8); ctx.fill();
    } else if (hat === 'cowboy') {
      ctx.fillStyle = '#b45309';
      ctx.beginPath(); ctx.ellipse(headX - 2, headY - 8, 14, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(headX - 8, headY - 16, 12, 9);
    } else if (hat === 'beanie') {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(headX - 2, headY - 6, 8, Math.PI, 0, false); ctx.fill();
    } else if (hat === 'wizard') {
      ctx.fillStyle = '#8b5cf6';
      ctx.beginPath(); ctx.moveTo(headX - 2, headY - 24); ctx.lineTo(headX - 12, headY - 6); ctx.lineTo(headX + 8, headY - 6); ctx.closePath(); ctx.fill();
    }

    if (loveSkin) {
      const pulse = 1 + Math.sin(animTime * 8) * 0.25;
      ctx.save();
      ctx.translate(isSitting ? 2 : 4, -4);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(0, 3);
      ctx.bezierCurveTo(-5, -3, -10, 0, 0, 8);
      ctx.bezierCurveTo(10, 0, 5, -3, 0, 3);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(isSitting ? 19 : 24, -16, 1.5 + Math.sin(animTime * 8) * 0.5, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    const tagY = isSitting ? -36 : -32;
    
    ctx.fillStyle = '#f59e0b';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(name, 0, tagY);

    if (chatMessage) {
      ctx.font = '12px sans-serif';
      const textWidth = ctx.measureText(chatMessage).width;
      const bubbleW = textWidth + 16;
      const bubbleH = 26;
      const bubbleX = -bubbleW / 2;
      const bubbleY = tagY - 32;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.roundRect(bubbleX, bubbleY, bubbleW, bubbleH, 8);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-4, bubbleY + bubbleH);
      ctx.lineTo(4, bubbleY + bubbleH);
      ctx.lineTo(0, bubbleY + bubbleH + 5);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'center';
      ctx.fillText(chatMessage, 0, bubbleY + 17);
    }

    ctx.restore();
  }

  function drawTree(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 25, 20, 8, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#3d2817'; ctx.fillRect(-5, 10, 10, 22);

    ctx.fillStyle = '#064e3b';
    ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(-30, 15); ctx.lineTo(30, 15); ctx.fill();

    ctx.fillStyle = '#047857';
    ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(-24, -2); ctx.lineTo(24, -2); ctx.fill();

    ctx.fillStyle = '#10b981';
    ctx.beginPath(); ctx.moveTo(0, -58); ctx.lineTo(-16, -16); ctx.lineTo(16, -16); ctx.fill();

    ctx.restore();
  }

  function drawNewCabinExterior(ctx, x, y) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#475569';
    ctx.fillRect(-10, 50, 220, 20);

    ctx.fillStyle = '#451a03';
    ctx.fillRect(0, -90, 200, 140);

    ctx.strokeStyle = '#27100b';
    ctx.lineWidth = 3;
    for (let ly = -80; ly <= 40; ly += 16) {
      ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(200, ly); ctx.stroke();
    }

    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.moveTo(-20, -90);
    ctx.lineTo(100, -150);
    ctx.lineTo(220, -90);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#78350f';
    ctx.fillRect(20, 10, 160, 40);
    ctx.strokeStyle = '#451a03';
    ctx.lineWidth = 2;
    ctx.strokeRect(20, 10, 160, 40);

    ctx.strokeStyle = '#9a3412';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(20, 15); ctx.lineTo(65, 15);
    ctx.moveTo(135, 15); ctx.lineTo(180, 15);
    ctx.stroke();

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(70, -30, 60, 70);
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(75, -25, 22, 30);
    ctx.fillRect(103, -25, 22, 30);

    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.arc(50, -20, 6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#f59e0b';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('ENTER CABIN', 50, -45);

    ctx.restore();
  }

  function drawNewCabinInterior(ctx, cx, cy) {
    const w = 880;
    const h = 560;
    const x = cx - w / 2;
    const y = cy - h / 2;

    ctx.fillStyle = '#1e1b18';
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = '#78350f';
    ctx.fillRect(x, y + 280, w, h - 280);
    ctx.strokeStyle = '#451a03';
    ctx.lineWidth = 2;
    for (let fy = y + 310; fy < y + h; fy += 30) {
      ctx.beginPath(); ctx.moveTo(x, fy); ctx.lineTo(x + w, fy); ctx.stroke();
    }

    const winX = cx - 220;
    const winY = y + 80;
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(winX, winY, 440, 160);
    ctx.fillStyle = '#0369a1';
    ctx.fillRect(winX, winY + 90, 440, 70);

    ctx.strokeStyle = '#451a03';
    ctx.lineWidth = 6;
    ctx.strokeRect(winX, winY, 440, 160);

    ctx.fillStyle = '#1e40af';
    ctx.fillRect(cx - 160, cy + 80, 320, 120);
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(cx - 140, cy + 95, 280, 90);

    ctx.fillStyle = '#334155';
    ctx.fillRect(x + 40, y + 180, 120, 180);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(x + 60, y + 250, 80, 90);
    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.arc(x + 100, y + 300, 20, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#451a03';
    ctx.fillRect(x + w - 140, y + 140, 100, 220);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(x + w - 130, y + 160, 25, 45);
    ctx.fillStyle = '#10b981'; ctx.fillRect(x + w - 100, y + 165, 20, 40);
    ctx.fillStyle = '#f59e0b'; ctx.fillRect(x + w - 130, y + 230, 60, 35);

    ctx.fillStyle = '#b45309';
    ctx.fillRect(cx - 80, cy + 90, 160, 80);

    ctx.fillStyle = '#0f172a'; ctx.fillRect(cx - 40, y + h - 35, 80, 35);
    ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('EXIT', cx - 12, y + h - 12);
  }

  const remotePlayers = {};
  if (db) {
    db.ref('players').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      const count = Object.keys(data).length;
      document.getElementById('activeCampers').innerText = count + (count === 1 ? ' Dachshund Online' : ' Dachshunds Online');

      Object.keys(data).forEach(id => {
        if (id === playerId) return;
        remotePlayers[id] = data[id];
      });
      Object.keys(remotePlayers).forEach(id => {
        if (!data[id]) delete remotePlayers[id];
      });
    });
  }

  let globalTime = 0;
  function gameLoop() {
    globalTime += 0.05;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    let isMoving = false;
    if (gameStarted && !myPlayer.isSitting && !isChatting) {
      if (keys['w'] || keys['arrowup'] || mobileKeys.up) { myPlayer.y -= myPlayer.speed; isMoving = true; }
      if (keys['s'] || keys['arrowdown'] || mobileKeys.down) { myPlayer.y += myPlayer.speed; isMoving = true; }
      if (keys['a'] || keys['arrowleft'] || mobileKeys.left) { myPlayer.x -= myPlayer.speed; myPlayer.facing = 'left'; isMoving = true; }
      if (keys['d'] || keys['arrowright'] || mobileKeys.right) { myPlayer.x += myPlayer.speed; myPlayer.facing = 'right'; isMoving = true; }
    }

    if (myPlayer.msgTimer > 0) {
      myPlayer.msgTimer--;
      if (myPlayer.msgTimer === 0) myPlayer.currentMsg = "";
    }

    if (playerRef && gameStarted) {
      playerRef.set({
        x: myPlayer.x,
        y: myPlayer.y,
        name: playerName,
        breed: dogBreed,
        hat: playerHat,
        isSitting: myPlayer.isSitting,
        inCabin: inCabin,
        facing: myPlayer.facing,
        isMoving: isMoving,
        msg: myPlayer.currentMsg,
        sonic: isSonic,
        love: hasLove
      }).catch(e => {});
    }

    const camX = cx - myPlayer.x;
    const camY = cy - myPlayer.y;

    ctx.save();
    ctx.translate(camX, camY);

    if (!inCabin) {
      ctx.fillStyle = '#0369a1';
      ctx.beginPath();
      ctx.ellipse(cx - 500, cy + 100, 350, 500, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const rx = cx - 500 + Math.sin(globalTime + i) * 30;
        const ry = cy - 100 + i * 90;
        ctx.beginPath(); ctx.arc(rx, ry, 40, 0, Math.PI); ctx.stroke();
      }

      ctx.fillStyle = '#78350f';
      ctx.fillRect(cx - 320, cy + 80, 140, 40);

      ctx.fillStyle = '#64748b';
      for (let px = cx - 180; px < cx + 250; px += 35) {
        ctx.beginPath(); ctx.arc(px, cy + 100, 12, 0, Math.PI * 2); ctx.fill();
      }

      trees.forEach(t => drawTree(ctx, t.x + cx, t.y + cy, t.scale));

      drawNewCabinExterior(ctx, cx + 180, cy - 100);

      logs.forEach(log => {
        ctx.save();
        ctx.translate(cx + log.offsetX, cy + log.offsetY);
        ctx.rotate(log.angle);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-30, -10, 60, 20);
        ctx.restore();
      });

      const glow = ctx.createRadialGradient(cx, cy, 5, cx, cy, 75);
      glow.addColorStop(0, 'rgba(245, 158, 11, 0.5)');
      glow.addColorStop(1, 'rgba(245, 158, 11, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, 75, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#f97316';
      ctx.beginPath(); ctx.arc(cx, cy, 14 + Math.sin(globalTime * 3) * 3, 0, Math.PI * 2); ctx.fill();

      fireflies.forEach(f => {
        f.x += f.speedX;
        f.y += f.speedY;
        const alpha = 0.3 + Math.sin(globalTime * 3 + f.phase) * 0.4;
        ctx.fillStyle = `rgba(254, 240, 138, ${Math.max(0, alpha)})`;
        ctx.beginPath(); ctx.arc(f.x + cx, f.y + cy, 2, 0, Math.PI * 2); ctx.fill();
      });
    } else {
      drawNewCabinInterior(ctx, cx, cy);
    }

    Object.keys(remotePlayers).forEach(id => {
      const p = remotePlayers[id];
      if (!!p.inCabin === inCabin) {
        drawDachshund(ctx, p.x, p.y, p.name || 'Dachshund', p.breed || 'black_tan', p.hat || 'none', p.isSitting, p.facing === 'right', p.isMoving, globalTime, p.msg, p.sonic, p.love);
      }
    });

    drawDachshund(ctx, myPlayer.x, myPlayer.y, playerName, dogBreed, playerHat, myPlayer.isSitting, myPlayer.facing === 'right', isMoving, globalTime, myPlayer.currentMsg, isSonic, hasLove);

    ctx.restore();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
